{% extends "base.html" %}

{% block auth_content %}
<div class="auth-container">
    <div class="auth-logo">myownX</div>
    <h2 class="auth-title">Sign in to myownX</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{% if category == 'error' %}danger{% else %}info{% endif %} alert-dismissible fade show mb-3" role="alert" style="border-radius: 8px; font-size: 0.9rem;">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control-custom" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control-custom" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-auth-submit">Sign In</button>
    </form>
    
    <div class="auth-footer">
        New to myownX? <a href="{{ url_for('register') }}">Sign up now</a>
    </div>
</div>
{% endblock %}
