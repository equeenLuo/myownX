<div class="modal fade sign-up-modal auth-modal" id="signUpModal" tabindex="-1" aria-labelledby="signUpModalLabel" aria-hidden="true" data-auto-show="{{ 'true' if request.endpoint == 'register' else 'false' }}">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content reply-modal-content">
            <div class="modal-header border-0 px-3 py-2">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <h2 class="visually-hidden" id="signUpModalLabel">Create your account</h2>
            </div>
            <div class="modal-body pt-0">
                <div class="auth-container">
                    <div class="auth-logo">myownX</div>
                    <h2 class="auth-title">Create your account</h2>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{% if category == 'error' %}danger{% elif category == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show mb-3" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="form-group">
                            <label class="form-label" for="sign-up-username">Username</label>
                            <input type="text" id="sign-up-username" name="username" class="form-control-custom" placeholder="Letters, numbers, or underscores" required autofocus>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="sign-up-display-name">Display name</label>
                            <input type="text" id="sign-up-display-name" name="display_name" class="form-control-custom" placeholder="Enter display name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="sign-up-email">Email</label>
                            <input type="email" id="sign-up-email" name="email" class="form-control-custom" placeholder="name@example.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="sign-up-password">Password</label>
                            <input type="password" id="sign-up-password" name="password" class="form-control-custom" placeholder="Set your login password" required>
                        </div>
                        <button type="submit" class="btn-auth-submit">Sign Up</button>
                    </form>
                    <div class="auth-footer">Already have an account? <button type="button" class="auth-link-button" data-auth-modal-target="signInModal">Sign in</button></div>
                </div>
            </div>
        </div>
    </div>
</div>
