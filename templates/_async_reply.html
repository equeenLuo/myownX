<article class="reply-post" data-post-id="{{ reply.id }}">
    <div class="reply-post-main">
        <a href="{{ url_for('user_profile', user_id=reply.author.id) }}" class="reply-post-avatar-link">
            <img src="{{ user_avatar_url(reply.author) }}" class="reply-post-avatar" alt="{{ reply.author.display_name or reply.author.username }} avatar">
        </a>
        <div class="reply-post-body">
            <div class="reply-post-meta">
                <a href="{{ url_for('user_profile', user_id=reply.author.id) }}" class="reply-post-author">{{ reply.author.display_name or reply.author.username }}</a>
                <span>@{{ reply.author.username }}</span><span>&middot;</span><a href="{{ url_for('post_detail', post_id=reply.id) }}" class="reply-post-time">0s</a>
            </div>
            {% if reply.reply_to_post %}
                <div class="replying-to">Replying to <a href="{{ url_for('user_profile', user_id=reply.reply_to_post.author.id) }}">@{{ reply.reply_to_post.author.username }}</a></div>
            {% endif %}
            <a href="{{ url_for('post_detail', post_id=reply.id) }}" class="reply-post-content">{{ reply.content }}</a>
            <div class="reply-post-actions">
                <button class="post-action action-comment" type="button" data-open-reply-modal="true" aria-label="Reply"><i class="bi bi-chat"></i><span>0</span></button>
                <form action="{{ url_for('create_repost', post_id=reply.id) }}" method="POST" class="post-action-form"><button class="post-action action-repost" type="submit" aria-label="Repost"><i class="bi bi-arrow-repeat"></i><span>0</span></button></form>
                <form action="{{ url_for('toggle_like', post_id=reply.id) }}" method="POST" class="post-action-form"><button class="post-action action-like" type="submit" aria-label="Like reply"><i class="bi bi-heart"></i><span>0</span></button></form>
                <button class="post-action action-share" type="button" onclick="navigator.clipboard.writeText('{{ url_for('post_detail', post_id=reply.id, _external=True) }}');" aria-label="Share"><i class="bi bi-share"></i></button>
            </div>
            <form id="reply-form-{{ reply.id }}" action="{{ url_for('create_comment', post_id=reply.id) }}" method="POST" class="reply-inline-form collapse">
                <input type="hidden" name="return_to_post_id" value="{{ reply.id }}">
                <input type="text" name="content" class="form-control form-control-sm" placeholder="Post your reply" maxlength="280" required>
                <button type="submit" class="btn btn-primary rounded-pill">Reply</button>
            </form>
        </div>
    </div>
</article>
