<!-- Edit Profile Modal Dialog Overlay -->
<div class="modal {% if request.path == '/profile/edit' %}show{% else %}fade{% endif %}" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true" style="{% if request.path == '/profile/edit' %}display: block; position: static; z-index: auto;{% endif %}">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 600px; {% if request.path == '/profile/edit' %}margin: 0 auto;{% endif %}">
        <div class="modal-content" style="border-radius: 16px; border: none; overflow: hidden; background-color: var(--myownx-bg);">
            
            <!-- Modal Header -->
            <div class="modal-header border-0 px-3 py-2 d-flex align-items-center justify-content-between" style="background-color: var(--myownx-bg);">
                <div class="d-flex align-items-center">
                    {% if request.path != '/profile/edit' %}
                        <button type="button" class="btn-close ms-0 me-3 p-0 d-flex align-items-center justify-content-center" data-bs-dismiss="modal" aria-label="Close" style="background: none; border: none; font-size: 1.5rem; color: var(--myownx-text); width: 36px; height: 36px; border-radius: 50%; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='rgba(15,20,25,0.08)'" onmouseout="this.style.backgroundColor='transparent'">
                            <i class="bi bi-x-lg" style="font-size: 1.15rem;"></i>
                        </button>
                    {% else %}
                        <a href="javascript:history.back()" class="text-dark me-3 p-0 d-flex align-items-center justify-content-center" style="width: 36px; height: 36px; border-radius: 50%; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='rgba(15,20,25,0.08)'" onmouseout="this.style.backgroundColor='transparent'">
                            <i class="bi bi-arrow-left fs-5"></i>
                        </a>
                    {% endif %}
                    <h2 class="fw-bold mb-0" style="font-size: 1.25rem; color: var(--myownx-text);">Edit profile</h2>
                </div>
                <!-- Save Button submits the inner form -->
                <button type="submit" form="editProfileForm" class="btn btn-dark rounded-pill px-3 py-1 fw-bold" style="font-size: 0.9rem; background-color: rgb(15, 20, 25); border: none; color: #ffffff;">Save</button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body p-0" style="background-color: var(--myownx-bg); max-height: 80vh; overflow-y: auto;">
                
                <!-- Flash messages inside Modal Body to support error flashes in both Modal and Page fallback -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="p-3">
                            {% for category, message in messages %}
                                <div class="alert alert-{% if category == 'error' %}danger{% elif category == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show mb-0" role="alert" style="border-radius: 8px; font-size: 0.9rem;">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <!-- Inner Form -->
                <form id="editProfileForm" action="{{ url_for('profile_edit') }}" method="POST" enctype="multipart/form-data" class="m-0">
                    
                    <!-- Profile Banner Upload Input Area -->
                    <div class="position-relative w-100 profile-cover-upload-container" style="height: 200px; overflow: hidden; background-color: rgb(207, 217, 222);">
                        <img src="{{ user_banner_url(current_user) }}" id="banner-preview" class="w-100 h-100" style="object-fit: cover;" alt="Banner Cover">
                        
                        <!-- Banner actions -->
                        <div class="position-absolute top-50 start-50 translate-middle d-flex gap-2" style="z-index: 3;">
                            <label for="profile_banner" class="bg-dark bg-opacity-75 text-white rounded-pill d-flex align-items-center justify-content-center gap-2 px-3" style="cursor: pointer; height: 36px; border: 1px solid rgba(255,255,255,0.25); transition: background-color 0.2s;" title="Change banner">
                                <i class="bi bi-camera"></i><span class="fw-semibold small">Change</span>
                            </label>
                            <input type="file" id="profile_banner" name="profile_banner" accept=".png,.jpg,.jpeg,.gif,.webp,image/png,image/jpeg,image/gif,image/webp" class="d-none" onchange="previewBanner(this)">
                            <input type="hidden" id="remove_profile_banner" name="remove_profile_banner" value="">
                            <button type="button" id="remove-banner-button" class="btn bg-dark bg-opacity-75 text-white rounded-pill d-flex align-items-center justify-content-center gap-2 px-3" style="height: 36px; border: 1px solid rgba(255,255,255,0.25);" onclick="removeBanner()">
                                <i class="bi bi-trash3"></i><span class="fw-semibold small">Delete</span>
                            </button>
                        </div>
                    </div>

                    <!-- Profile Avatar Upload Area -->
                    <div class="profile-avatar-upload-wrapper px-3" style="margin-top: -48px; margin-bottom: 16px; position: relative; z-index: 4;">
                        <div class="position-relative d-inline-block" style="z-index: 4;">
                            <img src="{{ user_avatar_url(current_user) }}" id="avatar-preview" class="profile-avatar border border-4 border-white" style="width: 96px; height: 96px; margin-top: 0; border-radius: 50%; object-fit: cover; background-color: #ffffff;" alt="Avatar">
                            
                            <!-- Camera icon centered -->
                            <label for="profile_picture" class="position-absolute top-50 start-50 translate-middle bg-dark bg-opacity-50 text-white rounded-circle d-flex align-items-center justify-content-center" style="cursor: pointer; width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.25); transition: background-color 0.2s;" title="Upload avatar">
                                <i class="bi bi-camera"></i>
                            </label>
                            <input type="file" id="profile_picture" name="profile_picture" accept=".png,.jpg,.jpeg,.gif,.webp,image/png,image/jpeg,image/gif,image/webp" class="d-none" onchange="previewImage(this)">
                        </div>
                    </div>

                    <!-- Input Fields -->
                    <!-- Display Name -->
                    <div class="mb-3 px-3">
                        <div class="form-floating-custom">
                            <span class="custom-floating-label">Name</span>
                            <input type="text" class="custom-input-field" id="display_name" name="display_name" value="{{ current_user.display_name if (current_user and current_user.display_name) else '' }}" placeholder="Name" required maxLength="50">
                        </div>
                    </div>

                    <!-- Biography -->
                    <div class="mb-3 px-3">
                        <div class="form-floating-custom">
                            <span class="custom-floating-label">Bio</span>
                            <textarea class="custom-input-field" id="bio" name="bio" rows="3" placeholder="Bio" maxLength="255" style="resize: none; height: auto;">{{ current_user.bio if (current_user and current_user.bio) else '' }}</textarea>
                            <div class="text-muted text-end small" style="position: absolute; right: 12px; bottom: 8px; font-size: 0.75rem;"><span id="bio-count">0</span>/255</div>
                        </div>
                    </div>

                    <!-- Location (Read Only) -->
                    <div class="mb-4 px-3">
                        <div class="form-floating-custom">
                            <span class="custom-floating-label">Location</span>
                            <input type="text" class="custom-input-field text-muted" value="China" placeholder="Location" readonly style="cursor: not-allowed;">
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<!-- Image Previewing & Bio Counter JS Helper -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof previewImage !== 'function') {
        window.previewImage = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('avatar-preview');
                    if (preview) preview.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    }

    if (typeof previewBanner !== 'function') {
        window.previewBanner = function(input) {
            if (input.files && input.files[0]) {
                const removeInput = document.getElementById('remove_profile_banner');
                if (removeInput) removeInput.value = '';
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('banner-preview');
                    if (preview) preview.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    }

    window.removeBanner = function() {
        const removeInput = document.getElementById('remove_profile_banner');
        const bannerInput = document.getElementById('profile_banner');
        const preview = document.getElementById('banner-preview');
        if (removeInput) removeInput.value = 'on';
        if (bannerInput) bannerInput.value = '';
        if (preview) preview.src = '{{ user_banner_url(None) }}';
    }

    // Bio Char Limit counter
    const bioTextarea = document.getElementById('bio');
    const bioCounter = document.getElementById('bio-count');
    if (bioTextarea && bioCounter) {
        bioCounter.textContent = bioTextarea.value.length;
        bioTextarea.addEventListener('input', function() {
            bioCounter.textContent = this.value.length;
        });
    }
});
</script>
