<div class="modal fade sign-in-modal auth-modal" id="signInModal" tabindex="-1" aria-labelledby="signInModalLabel" aria-hidden="true" data-auto-show="{{ 'true' if request.endpoint == 'login' else 'false' }}">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content reply-modal-content">
            <div class="modal-header border-0 px-3 py-2">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <h2 class="visually-hidden" id="signInModalLabel">Sign in to myownX</h2>
            </div>
            <div class="modal-body pt-0">
                <div class="auth-container">
                    <div class="auth-logo">myownX</div>
                    <h2 class="auth-title">Sign in to myownX</h2>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{% if category == 'error' %}danger{% elif category == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show mb-3" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="form-group">
                            <label class="form-label" for="sign-in-username">Username</label>
                            <input type="text" id="sign-in-username" name="username" class="form-control-custom" placeholder="Enter username" required autofocus>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="sign-in-password">Password</label>
                            <input type="password" id="sign-in-password" name="password" class="form-control-custom" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn-auth-submit">Sign In</button>
                    </form>
                    <div class="auth-secondary-link"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></div>
                    <div class="auth-footer">New to myownX? <button type="button" class="auth-link-button" data-auth-modal-target="signUpModal">Sign up now</button></div>
                </div>
            </div>
        </div>
    </div>
</div>
